name: trend-collect
on:
  schedule:
    - cron: "0 4 * * *"   # 07:30 تهران
    - cron: "0 16 * * *"  # 19:30 تهران
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trend-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect trends
        run: python trend_collector.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Generate content ideas
        run: python idea_generator.py
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      - name: Commit new trends and ideas
        run: |
          git config user.name "trend-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trends/*.jsonl ideas/*.jsonl ideas/*.md
          if git diff --cached --quiet; then
            echo "no new trends"
          else
            git commit -m "trends+ideas: update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3; do
              git push && break
              git pull --rebase --autostash origin main || true
            done
          fi
