name: collect
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "websockets>=13,<14"
      - run: python collector.py
        env:
          RUN_SECONDS: "200"
      - name: Commit new rounds
        run: |
          git config user.name "collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rounds-*.jsonl
          if git diff --cached --quiet; then
            echo "no new rounds"
          else
            git commit -m "rounds: update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3; do
              git push && break
              git pull --rebase --autostash origin main || true
            done
          fi
